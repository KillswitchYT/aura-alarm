name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

# A newer push replaces an older run, so a slow ring test never fights the next build over the logs branch.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # The runner image ships an Android SDK. Accept licences and make sure platform 37 and build-tools 37 are there.
      - name: Prepare Android SDK
        continue-on-error: true
        run: |
          {
            SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
            echo "SDK=$SDK  java=$(java -version 2>&1 | head -1)"
            ls "$SDK" || true
            SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
            ls "$SM" || true
            yes | "$SM" --licenses > /dev/null || yes | sudo env "PATH=$PATH" "JAVA_HOME=$JAVA_HOME" "$SM" --licenses > /dev/null || true
            echo "--- available platforms and build-tools >= 35:"
            "$SM" --list 2>/dev/null | grep -E 'platforms;android-(3[5-9])|build-tools;3[5-9]' | head -20 || true
            "$SM" "platforms;android-37" "build-tools;37.0.0" || sudo env "PATH=$PATH" "JAVA_HOME=$JAVA_HOME" "$SM" "platforms;android-37" "build-tools;37.0.0" || echo "sdkmanager could not install them, Gradle will try on its own"
            echo "--- installed:"; ls "$SDK/platforms" "$SDK/build-tools" || true
            echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          } 2>&1 | tee sdk.log

      # Works whether the repo holds the project itself or just AuraAlarm-native-source.zip.
      - name: Find the project
        id: p
        run: |
          if [ ! -f gradlew ]; then
            z=$(ls ./*.zip 2>/dev/null | head -1 || true)
            if [ -n "$z" ]; then unzip -q "$z"; fi
          fi
          g=$(find . -maxdepth 3 -name gradlew | head -1)
          echo "gradlew found at: $g"
          echo "dir=$(dirname "$g")" >> "$GITHUB_OUTPUT"

      # The optimized (R8) build is the app: one APK, signed with the fixed project key, so it installs over the debug build before it.
      - name: Build the app (optimized)
        working-directory: ${{ steps.p.outputs.dir }}
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      # The ring test (job below) installs exactly this file on an emulator.
      - name: Keep the APK for the ring test
        uses: actions/upload-artifact@v4
        with:
          name: aura-apk
          path: ${{ steps.p.outputs.dir }}/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn

      # The APK as a release: on a phone, open the repo's Releases page and tap AuraAlarm.apk. mapping.txt is only for decoding crash traces.
      - name: Publish the APK as a release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          d="${{ steps.p.outputs.dir }}"
          cp "$d/app/build/outputs/apk/release/app-release.apk" AuraAlarm.apk
          files="AuraAlarm.apk"
          m="$d/app/build/outputs/mapping/release/mapping.txt"
          if [ -f "$m" ]; then cp "$m" mapping.txt; files="$files mapping.txt"; fi
          gh release delete latest --cleanup-tag -y --repo "${{ github.repository }}" 2>/dev/null || true
          gh release create latest $files --repo "${{ github.repository }}" --target "$GITHUB_SHA" --prerelease \
            --title "Latest build" --notes "Built from commit ${GITHUB_SHA::7}. Optimized, signed with the fixed project key, so it updates over the previous build."

      - name: Show errors on the run page
        if: always()
        run: |
          d="${{ steps.p.outputs.dir }}"
          {
            echo "### Errors"
            echo '```'
            cat sdk.log "$d/build.log" 2>/dev/null | grep -E '^e: |^FAILURE|What went wrong|error:|failed|Failed' | head -60 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aura-release-apk
          path: |
            ${{ steps.p.outputs.dir }}/app/build/outputs/apk/release/*.apk
            ${{ steps.p.outputs.dir }}/build.log
            sdk.log
          if-no-files-found: warn

      # Lets an assistant read the result without downloading a zip: branch build-logs holds errors.txt and the full logs.
      - name: Publish the logs to branch build-logs
        if: always()
        run: |
          d="${{ steps.p.outputs.dir }}"
          mkdir -p /tmp/out
          cp "$d/build.log" /tmp/out/build.log 2>/dev/null || echo "no build log was produced (build step did not run)" > /tmp/out/build.log
          cp sdk.log /tmp/out/sdk.log 2>/dev/null || echo "no sdk log" > /tmp/out/sdk.log
          { cat /tmp/out/sdk.log /tmp/out/build.log | grep -E '^e: |What went wrong|error:|FAILURE|failed|Failed' | head -80 || true; } > /tmp/out/errors.txt
          [ -s /tmp/out/errors.txt ] || echo "no errors found" > /tmp/out/errors.txt
          echo "run $GITHUB_RUN_ID, commit $GITHUB_SHA" > /tmp/out/run.txt
          cd /tmp/out
          git init -q -b build-logs
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add .
          git commit -qm "logs for run $GITHUB_RUN_ID"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" build-logs

  # The "fake phone". It runs after the build, on its own, and can never stop the APKs from being published: a flaky emulator
  # is reported in branch build-logs (ring-result.txt, ring-test.log) and nowhere else.
  ring-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: aura-apk
          path: apk

      # The build you have installed now, to test the update you will do: this one installed over it, keeping its alarms.
      - name: Fetch the previous debug build for the update test
        run: |
          mkdir -p old
          curl -sSL --fail -o old/previous.apk "https://raw.githubusercontent.com/${{ github.repository }}/backup-3.1.33/backup/app-debug-3.1.33.apk"
          ls -l old/previous.apk

      # Lets the emulator use the machine's hardware acceleration.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Ring test on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: timeout 1500 bash tools/ci/ring-test.sh apk/app-release.apk com.killswitch.aura old/previous.apk

      - name: Show the result on the run page
        if: always()
        run: |
          {
            echo "### Ring test"
            echo '```'
            cat ring-result.txt 2>/dev/null || echo "the ring test did not run"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the ring test to branch build-logs
        if: always()
        run: |
          mkdir -p /tmp/rt && cd /tmp/rt
          URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git clone -q --depth 1 --branch build-logs "$URL" . || git init -q -b build-logs
          cp "$GITHUB_WORKSPACE/ring-test.log" ring-test.log 2>/dev/null || echo "the ring test did not run" > ring-test.log
          cp "$GITHUB_WORKSPACE/ring-result.txt" ring-result.txt 2>/dev/null || echo "no result: the ring test did not run" > ring-result.txt
          echo "run $GITHUB_RUN_ID, commit $GITHUB_SHA" > ring-run.txt
          git config user.name ci; git config user.email ci@users.noreply.github.com
          git add -A; git commit -qm "ring test for run $GITHUB_RUN_ID" || true
          git push "$URL" HEAD:build-logs
