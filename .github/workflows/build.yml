name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # The runner image ships an Android SDK. Accept licences and make sure platform 37 and build-tools 37 are there.
      - name: Prepare Android SDK
        continue-on-error: true
        run: |
          {
            SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
            echo "SDK=$SDK  java=$(java -version 2>&1 | head -1)"
            ls "$SDK" || true
            SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
            ls "$SM" || true
            yes | "$SM" --licenses > /dev/null || yes | sudo env "PATH=$PATH" "JAVA_HOME=$JAVA_HOME" "$SM" --licenses > /dev/null || true
            echo "--- available platforms and build-tools >= 35:"
            "$SM" --list 2>/dev/null | grep -E 'platforms;android-(3[5-9])|build-tools;3[5-9]' | head -20 || true
            "$SM" "platforms;android-37" "build-tools;37.0.0" || sudo env "PATH=$PATH" "JAVA_HOME=$JAVA_HOME" "$SM" "platforms;android-37" "build-tools;37.0.0" || echo "sdkmanager could not install them, Gradle will try on its own"
            echo "--- installed:"; ls "$SDK/platforms" "$SDK/build-tools" || true
            echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          } 2>&1 | tee sdk.log

      # Works whether the repo holds the project itself or just AuraAlarm-native-source.zip.
      - name: Find the project
        id: p
        run: |
          if [ ! -f gradlew ]; then
            z=$(ls ./*.zip 2>/dev/null | head -1 || true)
            if [ -n "$z" ]; then unzip -q "$z"; fi
          fi
          g=$(find . -maxdepth 3 -name gradlew | head -1)
          echo "gradlew found at: $g"
          echo "dir=$(dirname "$g")" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        working-directory: ${{ steps.p.outputs.dir }}
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      # The APK as a release: on a phone, open the repo's Releases page and tap app-debug.apk.
      - name: Publish the APK as a release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          d="${{ steps.p.outputs.dir }}"
          cp "$d/app/build/outputs/apk/debug/app-debug.apk" app-debug.apk
          gh release delete latest --cleanup-tag -y --repo "${{ github.repository }}" 2>/dev/null || true
          gh release create latest app-debug.apk --repo "${{ github.repository }}" --target "$GITHUB_SHA" --prerelease \
            --title "Latest debug build" --notes "Built from commit ${GITHUB_SHA::7}. Debug-signed with the fixed project key, so it updates over the previous build."

      - name: Show errors on the run page
        if: always()
        run: |
          d="${{ steps.p.outputs.dir }}"
          {
            echo "### Errors"
            echo '```'
            cat sdk.log "$d/build.log" 2>/dev/null | grep -E '^e: |^FAILURE|What went wrong|error:|failed|Failed' | head -60 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aura-debug-apk
          path: |
            ${{ steps.p.outputs.dir }}/app/build/outputs/apk/debug/*.apk
            ${{ steps.p.outputs.dir }}/build.log
            sdk.log
          if-no-files-found: warn

      # Lets an assistant read the result without downloading a zip: branch build-logs holds errors.txt and the full logs.
      - name: Publish the logs to branch build-logs
        if: always()
        run: |
          d="${{ steps.p.outputs.dir }}"
          mkdir -p /tmp/out
          cp "$d/build.log" /tmp/out/build.log 2>/dev/null || echo "no build log was produced (build step did not run)" > /tmp/out/build.log
          cp sdk.log /tmp/out/sdk.log 2>/dev/null || echo "no sdk log" > /tmp/out/sdk.log
          { cat /tmp/out/sdk.log /tmp/out/build.log | grep -E '^e: |What went wrong|error:|FAILURE|failed|Failed' | head -80 || true; } > /tmp/out/errors.txt
          [ -s /tmp/out/errors.txt ] || echo "no errors found" > /tmp/out/errors.txt
          echo "run $GITHUB_RUN_ID, commit $GITHUB_SHA" > /tmp/out/run.txt
          cd /tmp/out
          git init -q -b build-logs
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add .
          git commit -qm "logs for run $GITHUB_RUN_ID"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" build-logs
